    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; try_files $uri /index.php?$query_string; }

    # Статика сайта и загруженные картинки — с кэшем браузера
    location ~* ^/(css|js|img|storage)/ { expires 30d; access_log off; try_files $uri =404; }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "upload_max_filesize=16M \n post_max_size=20M";
        fastcgi_hide_header X-Powered-By;
    }

    # Остальные .php напрямую не исполняются; скрытые файлы закрыты
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
